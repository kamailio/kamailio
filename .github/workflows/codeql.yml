name: "CodeQL"

on:
  schedule:
    - cron: "30 0 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  # is required nightly build?
  # More info at https://stackoverflow.com/questions/63014786/how-to-schedule-a-github-actions-nightly-build-but-run-it-only-when-there-where
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: octokit/request-action@v2.x
        id: check_last_run
        with:
          route: GET /repos/{owner}/{repo}/actions/workflows/codeql.yml/runs?per_page=1&status=success
          owner: ${{ github.repository_owner }}
          repo: kamailio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Show last execution info
        run: |
          echo "Last daily build: ${{ fromJson(steps.check_last_run.outputs.data).workflow_runs[0].head_sha }}"
    outputs:
      last_sha: ${{ fromJson(steps.check_last_run.outputs.data).workflow_runs[0].head_sha }}
  analyze:
    needs: [check]
    if: needs.check.outputs.last_sha != github.sha
    name: Analyze
    runs-on: [self-hosted, linux, x64, codeql]
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript
            build-mode: autobuild
          - language: python
            build-mode: autobuild
          - language: cpp
            build-mode: manual
            c_compiler: clang
            build_type: Release
            kamailio_groups: DEFAULT

    container:
      image: ghcr.io/kamailio/pkg-kamailio-docker:${{ github.ref_name }}-trixie
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - ${{ github.workspace }}:/code

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure cmake
        if: ${{ matrix.language == 'cpp' }}
        uses: threeal/cmake-action@v2.1.0
        with:
          run-build: false
          build-dir: ${{github.workspace}}/build
          build-args: -j8
          options: |
            CMAKE_BUILD_TYPE=${{matrix.build_type}}
            MODULE_GROUP_NAME=${{matrix.kamailio_groups}}
            CMAKE_C_COMPILER=${{matrix.c_compiler}}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        if: ${{ matrix.language == 'javascript' || matrix.language == 'python' }}

      - name: Cmake Build
        if: ${{ matrix.language == 'cpp' }}
        uses: threeal/cmake-action@v2.1.0
        with:
          run-build: true
          build-dir: ${{github.workspace}}/build
          build-args: -j8
          options: |
            CMAKE_BUILD_TYPE=${{matrix.build_type}}
            MODULE_GROUP_NAME=${{matrix.kamailio_groups}}
            CMAKE_C_COMPILER=${{matrix.c_compiler}}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
