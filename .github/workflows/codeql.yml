name: "CodeQL"

on:
  schedule:
    - cron: "30 0 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  # is required nightly build?
  # More info at https://stackoverflow.com/questions/63014786/how-to-schedule-a-github-actions-nightly-build-but-run-it-only-when-there-where
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: octokit/request-action@v2.x
        id: check_last_run
        with:
          route: GET /repos/{owner}/{repo}/actions/workflows/codeql.yml/runs?per_page=1&status=success
          owner: ${{ github.repository_owner }}
          repo: kamailio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Show last execution info
        run: |
          echo "Last daily build: ${{ fromJson(steps.check_last_run.outputs.data).workflow_runs[0].head_sha }}"
    outputs:
      last_sha: ${{ fromJson(steps.check_last_run.outputs.data).workflow_runs[0].head_sha }}
  analyze:
    needs: [check]
    if: needs.check.outputs.last_sha != github.sha
    name: Analyze
    runs-on: [self-hosted, linux, x64, codeql]
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript
            build-mode: none
          - language: python
            build-mode: none
          - language: cpp
            build-mode: manual

    container:
      image: ghcr.io/kamailio/pkg-kamailio-docker:${{ github.ref_name }}-trixie
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - ${{ github.workspace }}:/code

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: List of modules
        id: set_values
        working-directory: /code
        run: |
          val=$(find pkg/kamailio/deb/trixie/ -type f -name '*.cmake-components' -exec cat {} \; | grep -v kamailio-core | xargs)
          echo "kam_grps=$val" >> "$GITHUB_OUTPUT"
          echo "nproc=$(nproc)" >> "$GITHUB_OUTPUT"

      - name: Configure cmake
        if: ${{ matrix.language == 'cpp' }}
        working-directory: /code
        run: |
          cmake -B /code/build -DMODULE_GROUP_NAME="${{ steps.set_values.outputs.kam_grps }}" -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        if: ${{ matrix.language == 'javascript' || matrix.language == 'python' }}

      - name: Cmake Build
        if: ${{ matrix.language == 'cpp' }}
        working-directory: /code
        run: |
          cmake --build /code/build -j${{ steps.set_values.outputs.nproc }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
