---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "github: [skip ci]"
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "github: [skip ci]"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "pre-commit: [skip ci]"
