---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "github: [skip ci]"
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "github: [skip ci]"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: weekly
    allow:
      # we want to check with the same version we have in ubuntu_latest
      - dependency-name: https://github.com/pre-commit/mirrors-clang-format
        version-update: semver-minor
    commit-message:
      prefix: "pre-commit: [skip ci]"
